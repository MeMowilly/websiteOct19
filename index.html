<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PIIology</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: white;
      color: darkblue;
      font-family: Georgia, serif;
      overflow: hidden;
    }

    #piiology {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 50pt;
      font-weight: bold;
      color: darkblue;
      opacity: 0;
      transition: opacity 10s ease-in-out;
      z-index: 10;
      pointer-events: none;
    }

    #trademark {
      font-size: 0.25em;
      vertical-align: super;
      margin-left: 0.2em;
    }

    #message {
      position: absolute;
      top: calc(40% + 4em);
      left: 50%;
      transform: translateX(-50%);
      font-size: 25pt;
      color: darkblue;
      opacity: 1;
      transition: opacity 3s ease-in-out;
      z-index: 9;
      pointer-events: none;
    }

    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
  </style>
</head>
<body>

  <div id="piiology">
    PIIology<span id="trademark">™</span>
  </div>
  <div id="message">We are working on something wonderful</div>
  <canvas id="matrix"></canvas>

  <script>
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');

    // configuration easy to tune:
    const fontSize = 14;                 // character size
    const matrixWidthRatio = 0.34;       // fraction of screen width used by matrix (0.0 - 1.0)
    const columnStaggerMs = 50;          // stagger delay between columns
    const drawIntervalMs = 80;           // frame interval in ms (larger -> less CPU)

    // Declare these before resizeCanvas runs to avoid ReferenceError.
    // They will be initialized (assigned) inside resizeCanvas().
    let columns = 0;
    let drops = [];
    let startDelays = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      // columns limited to a fraction of the screen width so matrix stays on left
      columns = Math.max(10, Math.floor((canvas.width * matrixWidthRatio) / fontSize));
      drops = Array(columns).fill(0);
      startDelays = new Array(columns);
      for (let i = 0; i < columns; i++) {
        startDelays[i] = Date.now() + i * columnStaggerMs;
      }
    }
    resizeCanvas();

    const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const numbers = '0123456789';
    const specialChars = '†‡§¶¤#@$%&*+=<>';
    const allChars = letters.repeat(2) + numbers.repeat(2) + specialChars;

    function draw() {
      // gentle trailing fade
      ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.font = `${fontSize}px Georgia`;

      // draw only in columns reserved for left side (matrixWidthRatio)
      for (let i = 0; i < columns; i++) {
        if (Date.now() < startDelays[i]) continue;
        const char = allChars.charAt(Math.floor(Math.random() * allChars.length));
        ctx.fillStyle = 'rgba(0, 60, 0, 0.9)';
        ctx.fillText(char, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }

    // Ensure we don't create multiple intervals if the script runs more than once.
    if (window.intervalId) {
      clearInterval(window.intervalId);
    }
    window.intervalId = setInterval(draw, drawIntervalMs);

    // Animation Sequence (fade logic)
    const piiology = document.getElementById('piiology');
    const message = document.getElementById('message');

    // Start fade-in after 3 seconds of rain
    setTimeout(() => {
      piiology.style.opacity = 1;
    }, 3000);

    // When the title's CSS transition ends, fade the message out
    const onTitleTransitionEnd = (e) => {
      if (e.propertyName === 'opacity') {
        // small extra pause after title finishes
        setTimeout(() => {
          message.style.opacity = 0;
        }, 300); // 300ms pause after title fully visible
        // remove listener so it doesn't run again
        piiology.removeEventListener('transitionend', onTitleTransitionEnd);
      }
    };
    piiology.addEventListener('transitionend', onTitleTransitionEnd);

    // Resize handler: recalculates columns/drops safely
    window.addEventListener('resize', () => {
      resizeCanvas();
    });
  </script>
</body>
</html>
