<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PIIology</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: white;
      color: darkblue;
      font-family: Georgia, serif;
      overflow: hidden;
    }

    #piiology {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 50pt;
      font-weight: bold;
      color: darkblue;
      opacity: 0;
      transition: opacity 10s ease-in-out;
      z-index: 10;
    }

    #trademark {
      font-size: 0.25em;
      vertical-align: super;
      margin-left: 0.2em;
    }

    #message {
      position: absolute;
      top: calc(40% + 4em);
      left: 50%;
      transform: translateX(-50%);
      font-size: 25pt;
      color: darkblue;
      opacity: 1;
      transition: opacity 3s ease-in-out;
      z-index: 9;
    }

    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
  </style>
</head>
<body>

  <div id="piiology">
    PIIology<span id="trademark">™</span>
  </div>
  <div id="message">We are working on something wonderful</div>
  <canvas id="matrix"></canvas>

  <script>
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const numbers = '0123456789';
    const specialChars = '†‡§¶¤#@$%&*+=<>';

    const allChars = letters.repeat(2) + numbers.repeat(2) + specialChars;
    const fontSize = 11;
    const columns = Math.floor(canvas.width / fontSize);
    const drops = Array(columns).fill(0);
    const startDelays = [];

    // Generate staggered random start times with spacing
    const used = [];
    while (used.length < columns) {
      let i;
      do {
        i = Math.floor(Math.random() * columns);
      } while (used.some(j => Math.abs(j - i) < 13) && used.length < columns - 13);
      if (!used.includes(i)) {
        used.push(i);
        const delay = used.length * 100; // 100ms between each
        startDelays[i] = Date.now() + delay;
      }
    }

    function draw() {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.font = `${fontSize}px Georgia`;
      for (let i = 0; i < columns; i++) {
        if (Date.now() < startDelays[i]) continue;

        const char = allChars.charAt(Math.floor(Math.random() * allChars.length));
        ctx.fillStyle = 'rgba(0, 60, 0, 0.9)';
        ctx.fillText(char, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }

        drops[i]++;
      }
    }

    setInterval(draw, 50);

    // Animation Sequence
    const piiology = document.getElementById('piiology');
    const message = document.getElementById('message');

    // Start fade-in after 3 seconds of rain
    setTimeout(() => {
      piiology.style.opacity = 1;
    }, 3000);

    // Fade out message only after fade-in completes
    setTimeout(() => {
      message.style.opacity = 0;
    }, 13000); // 3s delay + 10s fade

    // Resize handler
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
