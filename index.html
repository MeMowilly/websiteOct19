<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PIIology</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: white;
      color: darkblue;
      font-family: Georgia, serif;
      overflow: hidden;
    }

    #piiology {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 50pt;
      font-weight: bold;
      color: darkblue;
      opacity: 0;
      transition: opacity 10s ease-in-out;
      z-index: 10;
      pointer-events: none;
    }

    #trademark {
      font-size: 0.25em;
      vertical-align: super;
      margin-left: 0.2em;
    }

    #message {
      position: absolute;
      top: calc(40% + 4em);
      left: 50%;
      transform: translateX(-50%);
      font-size: 25pt;
      color: darkblue;
      opacity: 1;
      transition: opacity 3s ease-in-out;
      z-index: 9;
      pointer-events: none;
    }

    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
  </style>
</head>
<body>

  <div id="piiology">
    PIIology<span id="trademark">™</span>
  </div>
  <div id="message">We are working on something wonderful</div>
  <canvas id="matrix"></canvas>

  <script>
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');

    // configuration (tweak these values if you want a narrower/wider matrix)
    const fontSize = 16;                 // slightly larger -> fewer columns
    const matrixWidthRatio = 0.25;       // preferred fraction of screen width for matrix
    const columnStaggerMs = 50;          // stagger delay between columns
    const drawIntervalMs = 80;           // frame interval in ms (larger -> less CPU)
    const matrixMaxCenterEdgeRatio = 0.33; // safety cap (keeps matrix well left of center)
    const matrixLeftPadding = 12;        // px padding from left edge before columns start

    // Declare before use
    let columns = 0;
    let drops = [];
    let startDelays = [];

    // interval control (avoid duplicates)
    if (window.intervalId) {
      clearInterval(window.intervalId);
      window.intervalId = null;
    }

    // compute allowed pixel width for matrix (capped so it won't cross center)
    function computeMatrixPixelWidth() {
      const w = canvas.width;
      const preferred = w * matrixWidthRatio;
      const capped = Math.min(preferred, w * matrixMaxCenterEdgeRatio);
      return Math.max(capped, fontSize * 10); // ensure reasonable minimum area
    }

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const pixelWidth = Math.floor(computeMatrixPixelWidth());
      // subtract left padding so the actual drawing area stays away from edge
      const usable = Math.max(pixelWidth - matrixLeftPadding, fontSize * 10);
      columns = Math.max(10, Math.floor(usable / fontSize));

      drops = Array(columns).fill(0);
      startDelays = new Array(columns);
      const now = Date.now();
      for (let i = 0; i < columns; i++) {
        startDelays[i] = now + i * columnStaggerMs;
      }
    }

    // initialize and start animation loop only after we compute columns
    function initAndStart() {
      resizeCanvas();
      draw(); // draw initial frame immediately to avoid visual jump
      if (window.intervalId) clearInterval(window.intervalId);
      window.intervalId = setInterval(draw, drawIntervalMs);
    }

    // debounce resize to avoid rapid reinit
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      if (resizeTimer) clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        resizeTimer = null;
        resizeCanvas();
      }, 120);
    });

    const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const numbers = '0123456789';
    const specialChars = '†‡§¶¤#@$%&*+=<>';
    const allChars = letters.repeat(2) + numbers.repeat(2) + specialChars;

    function draw() {
      // gentle trailing fade (keeps background readable)
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.font = `${fontSize}px Georgia`;
      ctx.textBaseline = 'top';

      // draw only within the reserved left area; apply left padding
      for (let i = 0; i < columns; i++) {
        if (Date.now() < startDelays[i]) continue;
        const char = allChars.charAt(Math.floor(Math.random() * allChars.length));
        ctx.fillStyle = 'rgba(0,70,0,0.9)';
        const x = matrixLeftPadding + i * fontSize;
        ctx.fillText(char, x, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }

    // Animation Sequence (fade logic)
    const piiology = document.getElementById('piiology');
    const message = document.getElementById('message');

    // Start after load so fonts & layout are settled
    window.addEventListener('load', () => {
      initAndStart();

      // fade-in title after a short delay so the matrix is visible first
      setTimeout(() => {
        piiology.style.opacity = 1;
      }, 3000);

      // fade the message only after title's opacity transition completes
      const onTitleTransitionEnd = (e) => {
        if (e.propertyName === 'opacity') {
          setTimeout(() => { message.style.opacity = 0; }, 300);
          piiology.removeEventListener('transitionend', onTitleTransitionEnd);
        }
      };
      piiology.addEventListener('transitionend', onTitleTransitionEnd);
    });
  </script>
</body>
</html>
