<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PIIology</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: white;
      color: darkblue;
      font-family: Georgia, serif;
      overflow: hidden;
    }

    /* Title container with subtle opaque backdrop to guarantee readability */
    #piiology {
      position: absolute;
      top: 34%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 50pt;
      font-weight: bold;
      color: darkblue;
      opacity: 0;
      transition: opacity 2s ease-in-out;
      z-index: 20; /* above canvas */
      pointer-events: none;

      /* backdrop to guarantee the title is never dimmed by canvas */
      background: rgba(255,255,255,0.92);
      padding: 8px 18px;
      border-radius: 6px;
      box-shadow: 0 0 0 rgba(0,0,0,0); /* no visible shadow, placeholder only */
    }

    #trademark {
      font-size: 0.25em;
      vertical-align: super;
      margin-left: 0.2em;
    }

    /* message remains centered under title */
    #message {
      position: absolute;
      top: calc(40% + 4.2em);
      left: 50%;
      transform: translateX(-50%);
      font-size: 25pt;
      color: darkblue;
      opacity: 1;
      transition: opacity 3s ease-in-out;
      z-index: 19;
      pointer-events: none;
    }

    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
  </style>
</head>
<body>

  <div id="piiology">
    PIIology<span id="trademark">™</span>
  </div>
  <div id="message">We are working on something wonderful</div>
  <canvas id="matrix"></canvas>

  <script>
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');

    // configuration (tweak these if you want different density/width)
    const fontSize = 18;                   // larger => fewer columns
    const matrixWidthRatio = 0.20;         // fraction of screen width reserved for matrix
    const columnStaggerMs = 50;            // stagger delay between columns
    const drawIntervalMs = 100;            // slower -> less CPU
    const matrixMaxCenterEdgeRatio = 0.28; // cap so matrix stays left of center
    const matrixLeftPadding = 24;          // left padding before columns start

    // Declare state variables early
    let columns = 0;
    let drops = [];
    let startDelays = [];
    let matrixPixelWidth = 0;

    // avoid duplicated intervals
    if (window.intervalId) {
      clearInterval(window.intervalId);
      window.intervalId = null;
    }

    function computeMatrixPixelWidth() {
      const w = canvas.width;
      const preferred = w * matrixWidthRatio;
      const capped = Math.min(preferred, w * matrixMaxCenterEdgeRatio);
      return Math.max(capped, fontSize * 10);
    }

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      matrixPixelWidth = Math.floor(computeMatrixPixelWidth());
      const usable = Math.max(matrixPixelWidth - matrixLeftPadding, fontSize * 10);
      columns = Math.max(8, Math.floor(usable / fontSize));

      drops = Array(columns).fill(0);
      startDelays = new Array(columns);
      const now = Date.now();
      for (let i = 0; i < columns; i++) {
        startDelays[i] = now + i * columnStaggerMs;
      }
    }

    function initAndStart() {
      resizeCanvas();
      draw(); // initial frame to avoid visible jump
      if (window.intervalId) clearInterval(window.intervalId);
      window.intervalId = setInterval(draw, drawIntervalMs);
    }

    // debounce resize
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      if (resizeTimer) clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        resizeTimer = null;
        resizeCanvas();
      }, 140);
    });

    const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const numbers = '0123456789';
    const specialChars = '†‡§¶¤#@$%&*+=<>';
    const allChars = letters.repeat(2) + numbers.repeat(2) + specialChars;

    function draw() {
      // Only fade and draw inside the left reserved rectangle to avoid touching center/title
      ctx.fillStyle = 'rgba(255,255,255,0.09)'; // trail fade for left area
      ctx.fillRect(0, 0, matrixPixelWidth, canvas.height);

      ctx.font = `${fontSize}px Georgia`;
      ctx.textBaseline = 'top';

      for (let i = 0; i < columns; i++) {
        if (Date.now() < startDelays[i]) continue;
        const char = allChars.charAt(Math.floor(Math.random() * allChars.length));
        ctx.fillStyle = 'rgba(0,76,0,0.9)';
        const x = matrixLeftPadding + i * fontSize;
        ctx.fillText(char, x, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.98) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }

    // Animation/timing for title + message
    const piiology = document.getElementById('piiology');
    const message = document.getElementById('message');

    window.addEventListener('load', () => {
      initAndStart();

      // Start the title fade quickly so it becomes fully visible soon
      setTimeout(() => {
        piiology.style.opacity = 1;
      }, 1200); // shorter delay so title is readable earlier

      // Fade message after title transition completes
      const onTitleTransitionEnd = (e) => {
        if (e.propertyName === 'opacity') {
          setTimeout(() => { message.style.opacity = 0; }, 300);
          piiology.removeEventListener('transitionend', onTitleTransitionEnd);
        }
      };
      piiology.addEventListener('transitionend', onTitleTransitionEnd);
    });
  </script>
</body>
</html>
