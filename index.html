<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PIIology - Digital Rain</title>
  <style>
    body {
      margin: 0;
      background-color: white;
      overflow: hidden;
      font-family: Georgia, serif;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      display: block;
      z-index: 0;
    }

    #container {
      position: relative;
      width: 100%;
      height: 100vh;
      text-align: center;
      z-index: 1;
    }

    #message {
      position: absolute;
      top: 10%;
      width: 100%;
      font-size: 25pt;
      color: darkblue;
      opacity: 1;
      transition: opacity 6.67s linear;
    }

    #piiology {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 50pt;
      font-weight: bold;
      color: darkblue;
      opacity: 0;
      transition: opacity 6.67s linear;
    }

    #trademark {
      font-size: 0.25em;
      vertical-align: super;
      margin-left: 0.2em;
    }
  </style>
</head>
<body>
  <canvas id="matrix"></canvas>

  <div id="container">
    <div id="message">We are working on something wonderful</div>
    <div id="piiology">PIIology<span id="trademark">TM</span></div>
  </div>

  <script>
    // === MATRIX RAIN ===
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const fontSize = 16;
    const columns = Math.floor(canvas.width / fontSize);
    const drops = new Array(columns).fill(1);
    const startDelays = drops.map(() => Math.random() * 2000); // up to 2s delay

    const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const numbers = '0123456789';
    const controlChars = String.fromCharCode(...Array(32).keys()); // invisible
    const allChars = [...letters, ...numbers, ...controlChars];

    function draw() {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = 'rgb(0, 60, 0)';
      ctx.font = fontSize + 'px Georgia';

      for (let i = 0; i < columns; i++) {
        if (startDelays[i] > 0) {
          startDelays[i] -= 50;
          continue;
        }

        const rand = Math.random() * 100;
        let char;
        if (rand < 35) {
          char = letters.charAt(Math.floor(Math.random() * letters.length));
        } else if (rand < 75) {
          char = numbers.charAt(Math.floor(Math.random() * numbers.length));
        } else {
          char = controlChars.charAt(Math.floor(Math.random() * controlChars.length));
        }

        ctx.fillText(char, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }

    setInterval(draw, 50);

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    // === FADE LOGIC ===
    window.onload = () => {
      const piiology = document.getElementById('piiology');
      const message = document.getElementById('message');

      // Start fade
      setTimeout(() => {
        piiology.style.opacity = 1;
        message.style.opacity = 0;
      }, 100); // slight delay to allow CSS transitions
    };
  </script>
</body>
</html>
