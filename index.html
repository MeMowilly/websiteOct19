<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PIIology</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: white;
      color: darkblue;
      font-family: Georgia, serif;
      overflow: hidden;
    }

    #piiology {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 50pt;
      font-weight: bold;
      color: darkblue;
      opacity: 0;
      transition: opacity 10s ease-in-out;
      z-index: 10;
      pointer-events: none;
    }

    #trademark {
      font-size: 0.25em;
      vertical-align: super;
      margin-left: 0.2em;
    }

    #message {
      position: absolute;
      top: calc(40% + 4em);
      left: 50%;
      transform: translateX(-50%);
      font-size: 25pt;
      color: darkblue;
      opacity: 1;
      transition: opacity 3s ease-in-out;
      z-index: 9;
      pointer-events: none;
    }

    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
  </style>
</head>
<body>

  <div id="piiology">
    PIIology<span id="trademark">™</span>
  </div>
  <div id="message">We are working on something wonderful</div>
  <canvas id="matrix"></canvas>

  <script>
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');

    // configuration easy to tune:
    const fontSize = 14;                 // character size
    const matrixWidthRatio = 0.34;       // fraction of screen width reserved for matrix (0.0 - 1.0)
    const columnStaggerMs = 50;          // stagger delay between columns
    const drawIntervalMs = 80;           // frame interval in ms (larger -> less CPU)
    const matrixMaxCenterEdgeRatio = 0.45; // absolute maximum fraction (safe guard so matrix never crosses center area)

    // Declare these before resizeCanvas runs
    let columns = 0;
    let drops = [];
    let startDelays = [];

    // interval control
    if (window.intervalId) {
      clearInterval(window.intervalId);
      window.intervalId = null;
    }

    // Helper that computes allowed pixel width for matrix (capped)
    function computeMatrixPixelWidth() {
      const reserved = Math.min(canvas.width * matrixWidthRatio, canvas.width * matrixMaxCenterEdgeRatio);
      // ensure at least one column area exists
      return Math.max(reserved, fontSize * 10);
    }

    function resizeCanvas() {
      // keep pixel-perfect size
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      // compute how many columns fit into the reserved pixel width
      const pixelWidth = computeMatrixPixelWidth();
      columns = Math.max(10, Math.floor(pixelWidth / fontSize));

      // initialize arrays for drop positions and staggered starts
      drops = Array(columns).fill(0);
      startDelays = new Array(columns);
      const now = Date.now();
      for (let i = 0; i < columns; i++) {
        startDelays[i] = now + i * columnStaggerMs;
      }
    }

    // initialize once on load (ensures canvas and columns are stable before draw starts)
    function initAndStart() {
      resizeCanvas();
      // draw one frame immediately so layout looks sensible before interval begins
      draw();
      // ensure any previous interval is cleared
      if (window.intervalId) clearInterval(window.intervalId);
      window.intervalId = setInterval(draw, drawIntervalMs);
    }

    // small debounce for resize to avoid rapid reinitialization
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      if (resizeTimer) clearTimeout(resizeTimer);
      // wait a short amount of time for layout to settle (helps avoid jumps)
      resizeTimer = setTimeout(() => {
        resizeTimer = null;
        resizeCanvas();
      }, 120);
    });

    const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const numbers = '0123456789';
    const specialChars = '†‡§¶¤#@$%&*+=<>';
    const allChars = letters.repeat(2) + numbers.repeat(2) + specialChars;

    function draw() {
      // gentle trailing fade
      ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.font = `${fontSize}px Georgia`;
      ctx.textBaseline = 'top';

      // draw only in the left columns reserved for the matrix
      for (let i = 0; i < columns; i++) {
        if (Date.now() < startDelays[i]) continue;
        const char = allChars.charAt(Math.floor(Math.random() * allChars.length));
        ctx.fillStyle = 'rgba(0, 60, 0, 0.9)';
        ctx.fillText(char, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }

    // Animation Sequence (fade logic)
    const piiology = document.getElementById('piiology');
    const message = document.getElementById('message');

    // Start the animation after window load so fonts and layout are done
    window.addEventListener('load', () => {
      initAndStart();

      // Start fade-in after 3 seconds of rain (unchanged)
      setTimeout(() => {
        piiology.style.opacity = 1;
      }, 3000);

      // When the title's CSS transition ends, fade the message out
      const onTitleTransitionEnd = (e) => {
        if (e.propertyName === 'opacity') {
          // small extra pause after title finishes
          setTimeout(() => {
            message.style.opacity = 0;
          }, 300);
          // remove listener after first run
          piiology.removeEventListener('transitionend', onTitleTransitionEnd);
        }
      };
      piiology.addEventListener('transitionend', onTitleTransitionEnd);
    });
  </script>
</body>
</html>
